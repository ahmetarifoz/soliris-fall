# Copy this file to config.yaml (or config.local.yaml) and fill in your environment specifics.
app:
  model_path: models/yolo11m-pose.pt
  device: 0  # or "cpu"
  enable_hud: true
  save_path: out.mp4
  default_fps: 25
  max_tracks: 8
  rtsp_reconnect: true
  rtsp_max_retries: 6
  rtsp_retry_delay: 1.0
  rtsp_backend: ffmpeg
  rtsp_transport: udp
  rtsp_drop_frames: 5
  rtsp_ffmpeg_options:
    stimeout: 2000000
    fflags: nobuffer
    flags: low_delay
    probesize: 32
    analyzeduration: 0

detect:
  conf: 0.16
  iou: 0.55
  track_persist: true
  confirm_sec: 0.2
  recover_sec: 0.7
  recover_angle: 45.0
  cooldown_sec: 0.4
  alert_hold: 4.0
  temporal_window: 60
  temporal_min_hits: 3
  angle_th: 46
  still_bls: 0.12
  drop_rel: 1.0
  prune_sec: 1.2
  fall_latch_sec: 1.5
  pelvis_floor_frac: 0.25
  recover_lift_rel: 0.25
  frame_skip: 0
  candidate_alert_sec: 10.0
  fallen_alert_sec: 5.0

webhook:
  url: "https://example.com/webhook"
  hmac_secret: ""
  timeout_seconds: 3.0
  verify_ssl: true
  cooldown_seconds: 5.0

# OP500 integration (optional)
op500:
  enabled: false
  base_url: "http://localhost:8080/"
  rtp_auto_close_seconds: 120  # Auto-close RTP after no detection for this duration

# API server settings
api:
  enabled: false  # Enable REST API for remote control
  host: "0.0.0.0"
  port: 8000

# Ingest settings (like fsdapp)
ingest:
  backend: "ffmpeg"  # or "opencv"
  ffmpeg:
    hw: "cuda"  # or null for CPU
    loglevel: "warning"
    width: 1920
    height: 1080
    queue_size: 3
    reconnect_seconds: 2.0

# HUD settings (like fsdapp)
hud:
  fire_persistence_seconds: 30.0
  alert_persistence_seconds: 30.0

# Stream configurations (like fsdapp's streams list)
# Each stream can override ingest settings or use "inherit" to use defaults
streams:
  - camera_id: "cam1"
    source: "rtsp://USER:PASS@CAMERA_HOST:554/stream"
    # backend: inherit  # Optional: override ingest.backend
    # width: inherit    # Optional: override ingest.ffmpeg.width
    # height: inherit   # Optional: override ingest.ffmpeg.height
    # ffmpeg_hw: inherit  # Optional: override ingest.ffmpeg.hw
    # queue_size: inherit  # Optional: override ingest.ffmpeg.queue_size
    # reconnect_seconds: inherit  # Optional: override ingest.ffmpeg.reconnect_seconds
    rtp_port: 10160  # RTP port for OP500 trigger mapping
    rtp_loopback_enabled: false  # Enable RTP loopback (send frames back to RTP port)
